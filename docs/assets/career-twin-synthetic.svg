<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ProofLayer Career Twin synthetic product screenshot</title>
  <desc id="desc">A synthetic dark UI showing a local-first Career Twin, evidence cards, provenance, and a human review queue. No real personal data is shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#111b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72e6c5"/>
      <stop offset="1" stop-color="#8aa8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".08" stroke="#b9c7e8" stroke-width="1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M120 0V900M320 0V900M520 0V900M720 0V900M920 0V900M1120 0V900M1320 0V900M1520 0V900"/>
  </g>
  <rect x="0" y="0" width="250" height="900" fill="#0f172b"/>
  <rect x="250" y="0" width="1" height="900" fill="#2b3a5c"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#dce7ff">
    <text x="42" y="62" font-size="25" font-weight="700">ProofLayer</text>
    <text x="42" y="91" font-size="12" letter-spacing="2" fill="#78e2c1">CAREER TWIN</text>
    <rect x="30" y="132" width="190" height="44" rx="12" fill="#203252" stroke="#3d557c"/>
    <circle cx="53" cy="154" r="7" fill="#72e6c5"/>
    <text x="73" y="159" font-size="15" font-weight="600">Overview</text>
    <text x="52" y="219" font-size="15" fill="#9eafd0">My Career</text>
    <text x="52" y="265" font-size="15" fill="#9eafd0">Create Resume</text>
    <text x="52" y="311" font-size="15" fill="#9eafd0">Tailor to a Job</text>
    <text x="52" y="357" font-size="15" fill="#9eafd0">Updates</text>
    <text x="52" y="403" font-size="15" fill="#9eafd0">Clarifications</text>
    <text x="52" y="449" font-size="15" fill="#9eafd0">Advanced Review</text>
    <line x1="42" y1="520" x2="208" y2="520" stroke="#2b3a5c"/>
    <text x="42" y="562" font-size="11" letter-spacing="1.5" fill="#7d91b9">WORKSPACE</text>
    <text x="52" y="607" font-size="14" fill="#9eafd0">Local source folder</text>
    <rect x="42" y="632" width="128" height="26" rx="13" fill="#123f3b"/>
    <text x="58" y="650" font-size="11" fill="#72e6c5">PRIVATE BY DEFAULT</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
