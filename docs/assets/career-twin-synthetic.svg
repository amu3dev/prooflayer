    <rect x="604" y="324" width="128" height="24" rx="12" fill="#252d51"/>
    <text x="622" y="341" font-size="11" fill="#aebdff">LOCAL-FIRST</text>

    <rect x="1135" y="190" width="390" height="172" rx="18" fill="#141f38" stroke="#2d4167" filter="url(#shadow)"/>
    <text x="1167" y="232" font-size="13" letter-spacing="1.4" fill="#87a1ca">WORKFLOW STATUS</text>
    <text x="1167" y="278" font-size="28" font-weight="700" fill="#f3f7ff">Review required</text>
    <circle cx="1178" cy="320" r="7" fill="#f6c86e"/>
    <text x="1196" y="326" font-size="14" fill="#d9e5fb">3 claims waiting for approval</text>

    <text x="298" y="415" font-size="19" font-weight="650" fill="#f3f7ff">Evidence foundation</text>
    <text x="298" y="443" font-size="14" fill="#8fa4c8">Every candidate claim keeps its source, boundary, and review state.</text>
    <rect x="298" y="468" width="250" height="176" rx="16" fill="#121c32" stroke="#2d4167"/>
    <text x="324" y="509" font-size="13" fill="#87a1ca">SOURCE</text>
    <text x="324" y="546" font-size="20" font-weight="650" fill="#f3f7ff">Project notes</text>
    <text x="324" y="577" font-size="14" fill="#9eafd0">Imported locally</text>
    <rect x="324" y="600" width="103" height="25" rx="12" fill="#173d38"/>
    <text x="341" y="617" font-size="11" fill="#72e6c5">PRIVATE</text>
    <rect x="572" y="468" width="250" height="176" rx="16" fill="#121c32" stroke="#2d4167"/>
    <text x="598" y="509" font-size="13" fill="#87a1ca">CLAIM</text>
    <text x="598" y="546" font-size="20" font-weight="650" fill="#f3f7ff">Product judgment</text>
    <text x="598" y="577" font-size="14" fill="#9eafd0">Provenance attached</text>
    <rect x="598" y="600" width="122" height="25" rx="12" fill="#173d38"/>
    <text x="616" y="617" font-size="11" fill="#72e6c5">TRACEABLE</text>
    <rect x="846" y="468" width="264" height="176" rx="16" fill="#121c32" stroke="#2d4167"/>
    <text x="872" y="509" font-size="13" fill="#87a1ca">OUTPUT</text>
    <text x="872" y="546" font-size="20" font-weight="650" fill="#f3f7ff">Role resume</text>
    <text x="872" y="577" font-size="14" fill="#9eafd0">Approval boundary intact</text>
    <rect x="872" y="600" width="129" height="25" rx="12" fill="#283454"/>
    <text x="890" y="617" font-size="11" fill="#aebdff">NOT PUBLISHED</text>

    <rect x="1135" y="390" width="390" height="254" rx="18" fill="#141f38" stroke="#2d4167" filter="url(#shadow)"/>
    <text x="1167" y="432" font-size="13" letter-spacing="1.4" fill="#87a1ca">NEXT ACTION</text>
    <text x="1167" y="475" font-size="23" font-weight="650" fill="#f3f7ff">Review the evidence</text>
    <text x="1167" y="507" font-size="14" fill="#9eafd0">Confirm the claim boundary before drafting.</text>
    <rect x="1167" y="544" width="208" height="40" rx="10" fill="url(#accent)"/>
    <text x="1212" y="570" font-size="14" font-weight="700" fill="#07131f">Open review queue</text>

    <text x="298" y="726" font-size="19" font-weight="650" fill="#f3f7ff">Synthetic review queue</text>
    <rect x="298" y="751" width="1227" height="76" rx="14" fill="#121c32" stroke="#2d4167"/>
    <circle cx="332" cy="789" r="10" fill="#72e6c5"/>
    <text x="360" y="784" font-size="15" font-weight="600" fill="#f3f7ff">Trust boundary language</text>
    <text x="360" y="808" font-size="13" fill="#8fa4c8">Source: project note · status: approved · public-safe wording available</text>
    <rect x="1280" y="775" width="112" height="28" rx="14" fill="#173d38"/>
    <text x="1305" y="794" font-size="11" fill="#72e6c5">APPROVED</text>
  </g>
</svg>
