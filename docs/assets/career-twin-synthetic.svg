    <text x="298" y="120" font-size="34" font-weight="700" fill="#f3f7ff">Evidence-led career workspace</text>
    <text x="298" y="151" font-size="16" fill="#9eafd0">Review the evidence before it becomes a public-facing claim.</text>
    <rect x="1215" y="54" width="310" height="38" rx="19" fill="#263454" stroke="#526688"/>
    <text x="1238" y="79" font-size="12" letter-spacing="1.2" fill="#d8e5ff">SYNTHETIC UI • NO REAL DATA</text>

    <rect x="298" y="190" width="812" height="172" rx="18" fill="#141f38" stroke="#2d4167" filter="url(#shadow)"/>
    <text x="330" y="232" font-size="13" letter-spacing="1.4" fill="#72e6c5">CURRENT POSITIONING</text>
    <text x="330" y="274" font-size="25" font-weight="650" fill="#f3f7ff">AI product leader · trustworthy systems</text>
    <text x="330" y="308" font-size="15" fill="#b4c3df">A reviewed direction assembled from approved evidence, not a model-generated identity.</text>
    <rect x="330" y="324" width="132" height="24" rx="12" fill="#183d3b"/>
    <text x="348" y="341" font-size="11" fill="#72e6c5">EVIDENCE-LED</text>
